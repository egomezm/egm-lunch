<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <g fill="#fff">
    <!-- pizza slice -->
    <g transform="translate(30 30) rotate(-18 40 40)">
      <path d="M40 80 L2 8 Q40 -8 78 8 Z"/>
      <circle cx="30" cy="28" r="6" fill="#000"/>
      <circle cx="50" cy="40" r="6" fill="#000"/>
      <circle cx="38" cy="56" r="4.5" fill="#000"/>
    </g>
    <!-- burger -->
    <g transform="translate(215 25) rotate(10 40 30)">
      <path d="M4 26 Q4 4 40 4 Q76 4 76 26 Z"/>
      <rect x="2" y="31" width="76" height="8" rx="4"/>
      <rect x="6" y="43" width="68" height="9" rx="4.5"/>
      <path d="M4 56 H76 Q76 68 64 68 H16 Q4 68 4 56 Z"/>
    </g>
    <!-- cup with straw -->
    <g transform="translate(150 120) rotate(8 25 40)">
      <path d="M6 18 H44 L39 78 H11 Z"/>
      <rect x="2" y="12" width="48" height="7" rx="3.5"/>
      <rect x="28" y="-8" width="5" height="24" rx="2.5" transform="rotate(14 30 4)"/>
    </g>
    <!-- fries -->
    <g transform="translate(40 150) rotate(-10 30 40)">
      <rect x="8" y="2" width="9" height="40" rx="3" transform="rotate(-8 12 22)"/>
      <rect x="22" y="-4" width="9" height="46" rx="3"/>
      <rect x="36" y="2" width="9" height="40" rx="3" transform="rotate(8 40 22)"/>
      <path d="M2 38 H52 L46 78 H8 Z"/>
    </g>
    <!-- apple -->
    <g transform="translate(260 165) rotate(14 30 35)">
      <path d="M30 18 C14 4 -4 18 2 40 C8 62 22 70 30 64 C38 70 52 62 58 40 C64 18 46 4 30 18 Z"/>
      <path d="M30 18 Q28 6 36 -4 Q40 8 30 18 Z"/>
    </g>
    <!-- taco -->
    <g transform="translate(25 265) rotate(6 40 30)">
      <path d="M2 50 A38 38 0 0 1 78 50 Z"/>
      <path d="M12 50 A28 28 0 0 1 68 50" fill="none" stroke="#000" stroke-width="3"/>
    </g>
    <!-- ice cream cone -->
    <g transform="translate(150 255) rotate(-12 25 40)">
      <circle cx="25" cy="22" r="20"/>
      <path d="M7 34 H43 L25 86 Z"/>
      <path d="M12 42 L36 62 M20 38 L36 52 M10 54 L26 70" stroke="#000" stroke-width="2.5" fill="none"/>
    </g>
    <!-- sushi roll -->
    <g transform="translate(270 275) rotate(8 30 30)">
      <ellipse cx="30" cy="30" rx="28" ry="26"/>
      <ellipse cx="30" cy="30" rx="18" ry="16" fill="#000"/>
      <ellipse cx="30" cy="30" rx="8" ry="7"/>
    </g>
  </g>
</svg>
